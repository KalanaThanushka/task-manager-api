# Name of this pipeline — shows up on GitHub
name: CI Pipeline

# TRIGGER: When should this pipeline run?
on:
  push:
    branches: [ main, develop ]   # runs when you push to main or develop
  pull_request:
    branches: [ main ]            # runs when someone opens a PR to main

# JOBS: What should it do?
jobs:

  # ── Job 1: Test & Lint ──────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest    # use a fresh Ubuntu Linux machine

    steps:
      # Step 1: Download your code onto the machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js on that machine
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'            # cache node_modules to speed up future runs

      # Step 3: Install your dependencies (npm install)
      - name: Install dependencies
        run: npm ci               # 'npm ci' is like 'npm install' but faster & stricter for pipelines

      # Step 4: Run your tests
      - name: Run tests
        run: npm test

      # Step 5: Upload coverage report as an artifact
      # This saves the coverage folder so you can download and view it
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7       # keep it for 7 days then auto delete

  # ── Job 2: Security Scan ────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test                   # only runs AFTER test job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Checks your packages for known security vulnerabilities
      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true   # don't fail the pipeline for warnings, just report
